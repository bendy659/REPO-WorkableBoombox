[config]
schemaVersion = "0.0.1"

[package]
namespace = "Bendy659nGemini"
name = "WorkableBoombox"
versionNumber = "1.1.5"
description = "A fully functional portable boombox with custom music, YouTube audio support, playlists, volume control, and party lights for R.E.P.O."
websiteUrl = "https://github.com/bendy659/REPO-WorkableBoombox"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
Zehs-REPOLib = "4.3.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./ReleasePackage/WorkableBoombox.dll"
target = "WorkableBoombox.dll"

[publish]
repository = "https://thunderstore.io"
communities = [ "repo" ]

[publish.categories]
repo = [ "items", "audio" ]
